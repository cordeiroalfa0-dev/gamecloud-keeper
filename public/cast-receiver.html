<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Master Games Arcade — Receptor para TV</title>
    <style>
      html,
      body,
      #system {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        border: 0;
        background: #050009;
      }

      #system {
        position: fixed;
        inset: 0;
      }

      #loading {
        position: fixed;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        color: #00e5ff;
        background: #050009;
        font: bold 20px monospace;
        letter-spacing: 0.08em;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      #loading.hidden {
        opacity: 0;
      }

      #error {
        display: none;
        max-width: 720px;
        padding: 32px;
        color: #fff;
        font: 18px/1.6 monospace;
        text-align: center;
      }

      #error.visible {
        display: block;
      }
    </style>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <iframe
      id="system"
      title="Master Games Arcade — Modo TV"
      allow="autoplay; fullscreen; gamepad"
      allowfullscreen
    ></iframe>
    <div id="loading">A ABRIR O GAMECLOUD KEEPER NA TV…</div>
    <div id="error"></div>
    <script>
      (() => {
        const frame = document.getElementById("system");
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const hideLoading = () => loading.classList.add("hidden");

        frame.addEventListener("load", () => {
          hideLoading();
          window.setTimeout(() => loading.remove(), 250);
        });
        frame.addEventListener("error", () => {
          error.textContent =
            "Não foi possível abrir o sistema. Verifique a ligação à Internet da TV e tente novamente.";
          error.classList.add("visible");
        });
        frame.src = "/?launcher=1&tv=1&cast=1";

        try {
          const receiverContext = cast.framework.CastReceiverContext.getInstance();
          receiverContext.start();
        } catch (cause) {
          console.error("Falha ao iniciar o receptor Google Cast", cause);
          error.textContent = "O receptor Google Cast não conseguiu iniciar.";
          error.classList.add("visible");
        }
      })();
    </script>
  </body>
</html>
